      with:
        fetch-depth: 0
        clean: true
    - name: Install the current repository
      run: |
        uv pip install pytest pytest-asyncio
        uv pip install --no-deps --no-build-isolation -e .
    - name: Check final pip list
      run: |
        uv pip list
    - name: Prepare weights
      run: |
        ln -s /root/.cache/modelscope/hub/models ~/models
    - name: Initialize branch coverage collection
      run: |
        command -v uv >/dev/null || python -m pip install uv
        uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2"
        python scripts/ci/coverage/collect.py init
      shell: bash
    - name: Prepare GSM8K dataset
      run: |
        python examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/modelscope/dataset/openai/gsm8k
      shell: python scripts/ci/coverage/collect.py run step-07 {0}
    - name: Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (DeepSeek)
      run: |
        ray stop --force
        OPTIM_MEMORY_EFFICIENT=True ENGINE=sglang COMMON_VPP=NULL USE_REMOVE_PADDING=True SAVE_FREQ=1 MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct bash tests/special_e2e/run_ppo_trainer_megatron.sh
      shell: python scripts/ci/coverage/collect.py run step-08 {0}
    - name: Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (DeepSeek)
      run: |
        ray stop --force
        export VLLM_USE_V1=1
        ray start --head
        ENGINE=sglang MODE=async RESUME_MODE=auto COMMON_VPP=NULL USE_REMOVE_PADDING=True MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct TOTAL_TRAIN_STEPS=2 bash tests/special_e2e/run_ppo_trainer_megatron.sh
      shell: python scripts/ci/coverage/collect.py run step-09 {0}
