      UV_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: '120'
      UV_NO_CACHE: '1'
      UV_SYSTEM_PYTHON: '1'
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      TRANSFORMERS_VERBOSITY: error
      VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_ppo_trainer_megatron_sglang_2_ascend__1/data
      VERL_COVERAGE_WORKFLOW: e2e_ppo_trainer_megatron_sglang_2_ascend.yml
      VERL_COVERAGE_JOB: e2e_ppo_trainer_fsdp_sglang_ascend
      VERL_COVERAGE_PLAN: '[{"id": "step-07", "name": "Prepare GSM8K dataset", "entrypoints": ["examples/data_preprocess/gsm8k.py"],
        "requires_verl_coverage": false}, {"id": "step-08", "name": "Running GSM8K E2E training tests on 8 NPUs with rmpad
        using function rm and save ckpt", "entrypoints": ["tests/special_e2e/ppo_trainer/run_function_reward.sh"], "requires_verl_coverage":
        true}]'
    needs:
    - validate
    name: e2e_ppo_trainer_megatron_sglang_2_ascend.yml / e2e_ppo_trainer_fsdp_sglang_ascend
    steps:
    - name: Check npu and CANN info
      run: |
        cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
        npu-smi info
    - name: Install uv
      run: pip install uv
    - name: Check initial pip list from image
      run: |
        uv pip list
    - name: Checkout verl-project/verl repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
    - name: Install the current repository
      run: |
        uv pip install pytest pytest-asyncio
        uv pip install --no-deps --no-build-isolation -e .
    - name: Check final pip list
      run: |
        uv pip list
    - name: Prepare weights
      run: |
        ln -s /root/.cache/modelscope/hub/models ~/models
    - name: Initialize branch coverage collection
      run: |
        command -v uv >/dev/null || python -m pip install uv
        uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2"
        python scripts/ci/coverage/collect.py init
      shell: bash
    - name: Prepare GSM8K dataset
      run: |
        ray stop --force
        python examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/modelscope/dataset/openai/gsm8k
      shell: python scripts/ci/coverage/collect.py run step-07 {0}
    - name: Running GSM8K E2E training tests on 8 NPUs with rmpad using function rm and save ckpt
      run: |
        ray stop --force
        ENGINE=sglang bash tests/special_e2e/ppo_trainer/run_function_reward.sh
      shell: python scripts/ci/coverage/collect.py run step-08 {0}
    - name: Package raw coverage (including partial runs)
      if: ${{ always() }}
      shell: bash
      run: python scripts/ci/coverage/collect.py package
    - name: Retain raw coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ascend-coverage-e2e_ppo_trainer_megatron_sglang_2_ascend__1-${{ github.run_attempt }}
        path: ${{ env.VERL_COVERAGE_ROOT }}/../coverage.tar.gz
        compression-level: 0
        if-no-files-found: warn
        retention-days: 14
  e2e_ppo_trainer_megatron_sglang_ascend__1:
