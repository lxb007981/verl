# Generated by scripts/ci/coverage/generate_workflow.py; do not edit by hand.
name: Coverage Collection (Ascend PR workloads)
'on':
  workflow_dispatch: null
  pull_request:
    branches:
    - main
    - v0.*
    paths:
    - .github/workflows/coverage-collection-npu.yml
    - scripts/ci/**
    - .github/workflows/e2e_ascend.yml
    - .github/workflows/e2e_ppo_trainer_megatron_sglang_2_ascend.yml
    - .github/workflows/e2e_ppo_trainer_megatron_sglang_ascend.yml
    - .github/workflows/e2e_ppo_trainer_megatron_vllm_2_ascend.yml
    - .github/workflows/e2e_ppo_trainer_veomni_vllm_ascend.yml
    - .github/workflows/e2e_sft_llm_ascend.yml
    - .github/workflows/e2e_v1_separate_async_ascend.yml
    - .github/workflows/model_ascend.yml
    - .github/workflows/npu_unit_tests.yml
    - .github/workflows/reward_model_sglang_ascend.yml
    - .github/workflows/reward_model_vllm_ascend.yml
    - .github/workflows/sgl_ascend.yml
    - .github/workflows/vllm_ascend.yml
  schedule:
  - cron: 0 21 */2 * *
permissions:
  contents: read
concurrency:
  group: ascend-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Check collection workflow matches PR workloads
      run: uv run --no-project --python 3.12 --no-build --with PyYAML==6.0.2 python scripts/ci/coverage/generate_workflow.py
        --check
  e2e_ascend__1:
    if: ${{ github.repository_owner == 'verl-project' && (github.repository_owner == 'verl-project') }}
    name: e2e_ascend.yml / llm_rl_job
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: 270
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: --shm-size 16g
    env:
      HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets
      MEGATRON_CONFIG_LOCK_DIR: /root/.cache/temp/megatron-config-locks
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      UV_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: '120'
      UV_NO_CACHE: '1'
      UV_SYSTEM_PYTHON: '1'
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      TRANSFORMERS_VERBOSITY: error
      VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_ascend__1/data
      VERL_COVERAGE_WORKFLOW: e2e_ascend.yml
      VERL_COVERAGE_JOB: llm_rl_job
      VERL_COVERAGE_PLAN: '[{"id": "step-06", "name": "Preprocess gsm8k dataset", "entrypoints": ["examples/data_preprocess/gsm8k.py"],
        "requires_verl_coverage": false}, {"id": "step-07", "name": "Running gsm8k e2e training tests with PPO on ASCEND NPU
        (FSDP backend)", "entrypoints": ["tests/special_npu/run_qwen3_06b_ppo.sh"], "requires_verl_coverage": true}, {"id":
        "step-08", "name": "Running gsm8k e2e training tests with GRPO on ASCEND NPU (FSDP backend)", "entrypoints": ["tests/special_npu/run_qwen3_8b_grpo_profiling.sh",
        "tests/utils/test_check_profiler_output.py"], "requires_verl_coverage": true}, {"id": "step-09", "name": "Running
        gsm8k e2e training tests with GRPO on ASCEND NPU (MindSpeed backend)", "entrypoints": ["tests/special_npu/run_qwen3_06b_grpo_mindspeed.sh"],
        "requires_verl_coverage": true}, {"id": "step-10", "name": "Running gsm8k e2e training tests with GRPO on ASCEND NPU
        (MindSpeed backend, MoE Model)", "entrypoints": ["tests/special_npu/run_qwen3_30b_grpo_mindspeed.sh"], "requires_verl_coverage":
        true}]'
    needs:
    - validate
    steps:
    - name: Check npu and CANN info
      run: |
        cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
        npu-smi info
    - name: Install uv
      run: pip install uv
    - name: Check initial pip list from image
      run: |
        uv pip list
    - name: Checkout verl-project/verl repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
    - name: Install the current repository
      run: |
        uv pip install --no-deps -e .
        uv pip install --no-deps TransferQueue==0.1.11
        pip uninstall -y nvidia-resiliency-ext
    - name: Check final pip list
      run: |
        uv pip list
    - name: Initialize branch coverage collection
      run: |
        command -v uv >/dev/null || python -m pip install uv
        uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2"
        python scripts/ci/coverage/collect.py init
      shell: bash
    - name: Preprocess gsm8k dataset
      run: |
        python examples/data_preprocess/gsm8k.py --local_dataset_path /root/.cache/modelscope/dataset/openai/gsm8k
      shell: python scripts/ci/coverage/collect.py run step-06 {0}
    - name: Running gsm8k e2e training tests with PPO on ASCEND NPU (FSDP backend)
      run: |
        ray stop --force
        bash tests/special_npu/run_qwen3_06b_ppo.sh
        rm -rf $HOME/ckpts
      shell: python scripts/ci/coverage/collect.py run step-07 {0}
    - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (FSDP backend)
      run: |
        ray stop --force
        bash tests/special_npu/run_qwen3_8b_grpo_profiling.sh
        python3 "tests/utils/test_check_profiler_output.py" --profiler_dir="./profiler_data-dis" --device="npu" \
          --stage actor_update actor_compute_log_prob '*_rollout_*'
        rm -rf ./profiler_data-dis
        rm -rf $HOME/ckpts
      shell: python scripts/ci/coverage/collect.py run step-08 {0}
    - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (MindSpeed backend)
      run: |
        ray stop --force
        USE_DIST_CKPT=False bash tests/special_npu/run_qwen3_06b_grpo_mindspeed.sh
        rm -rf $HOME/ckpts
      shell: python scripts/ci/coverage/collect.py run step-09 {0}
    - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (MindSpeed backend, MoE Model)
      run: |
        ray stop --force
        USE_DIST_CKPT=False USE_DUMMY_MODEL=True DUMMY_MODEL_CONFIG_PATH=tests/special_e2e/ppo_trainer/expert_parallel/qwen3moe_minimal.json DUMMY_MODEL_PATH=$HOME/dist_ckpt/qwen3_30b_grpo_mindspeed bash tests/special_npu/run_qwen3_30b_grpo_mindspeed.sh
      shell: python scripts/ci/coverage/collect.py run step-10 {0}
    - name: Package raw coverage (including partial runs)
      if: ${{ always() }}
      shell: bash
      run: python scripts/ci/coverage/collect.py package
    - name: Retain raw coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ascend-coverage-e2e_ascend__1-${{ github.run_attempt }}
        path: ${{ env.VERL_COVERAGE_ROOT }}/../coverage.tar.gz
        compression-level: 0
        if-no-files-found: warn
        retention-days: 14
  e2e_ascend__2:
    if: ${{ github.repository_owner == 'verl-project' && (github.repository_owner == 'verl-project') }}
    needs:
    - validate
    - e2e_ascend__1
    name: e2e_ascend.yml / vlm_rl_job
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: 350
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: --shm-size 160g
    env:
      HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets
      MEGATRON_CONFIG_LOCK_DIR: /root/.cache/temp/megatron-config-locks
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      TRANSFORMERS_VERBOSITY: error
      VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_ascend__2/data
      VERL_COVERAGE_WORKFLOW: e2e_ascend.yml
      VERL_COVERAGE_JOB: vlm_rl_job
      VERL_COVERAGE_PLAN: '[{"id": "step-05", "name": "Preprocess geo3k dataset", "entrypoints": ["examples/data_preprocess/geo3k.py"],
        "requires_verl_coverage": false}, {"id": "step-06", "name": "Running geo3k e2e training tests with GRPO on ASCEND
        NPU", "entrypoints": ["tests/special_npu/run_qwen3_vl_8b_Instruct_fsdp2_npu.sh"], "requires_verl_coverage": true},
        {"id": "step-07", "name": "Running geo3k e2e training tests with GRPO on ASCEND NPU (FSDP-Turbo backend)", "entrypoints":
        ["tests/special_npu/run_qwen3_5_2b_fsdp_turbo.sh"], "requires_verl_coverage": true}]'
    steps:
    - name: Check npu and CANN info
      run: |
        cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
        npu-smi info
    - name: Check initial pip list from image
      run: |
        pip list
    - name: Checkout verl-project/verl repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
    - name: Install the current repository
      run: |
        pip install --no-deps -e .
        pip install --no-deps TransferQueue==0.1.11
    - name: Check final pip list
      run: |
        pip list
    - name: Initialize branch coverage collection
      run: |
        command -v uv >/dev/null || python -m pip install uv
        uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2"
        python scripts/ci/coverage/collect.py init
      shell: bash
    - name: Preprocess geo3k dataset
      run: |
        python examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/.cache/modelscope/dataset/hiyouga/geometry3k
      shell: python scripts/ci/coverage/collect.py run step-05 {0}
    - name: Running geo3k e2e training tests with GRPO on ASCEND NPU
      run: |
        ray stop --force
        SAVE_FREQ=-1 TOTAL_TRAINING_STEPS=1 bash tests/special_npu/run_qwen3_vl_8b_Instruct_fsdp2_npu.sh
        rm -rf $HOME/ckpts
      shell: python scripts/ci/coverage/collect.py run step-06 {0}
    - name: Running geo3k e2e training tests with GRPO on ASCEND NPU (FSDP-Turbo backend)
      run: |
        rm -rf /FSDPTurbo
        git clone https://gitcode.com/Ascend/FSDPTurbo.git /FSDPTurbo
        export PYTHONPATH=/FSDPTurbo:$PYTHONPATH
        ray stop --force
        bash tests/special_npu/run_qwen3_5_2b_fsdp_turbo.sh
      shell: python scripts/ci/coverage/collect.py run step-07 {0}
    - name: Package raw coverage (including partial runs)
      if: ${{ always() }}
      shell: bash
      run: python scripts/ci/coverage/collect.py package
    - name: Retain raw coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ascend-coverage-e2e_ascend__2-${{ github.run_attempt }}
        path: ${{ env.VERL_COVERAGE_ROOT }}/../coverage.tar.gz
        compression-level: 0
        if-no-files-found: warn
        retention-days: 14
  e2e_ppo_trainer_megatron_sglang_2_ascend__1:
    if: ${{ github.repository_owner == 'verl-project' && (github.repository_owner == 'verl-project') }}
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 210
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-sglang-a3-ubuntu
