      VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_ppo_trainer_megatron_sglang_ascend__1/data
      VERL_COVERAGE_WORKFLOW: e2e_ppo_trainer_megatron_sglang_ascend.yml
      VERL_COVERAGE_JOB: e2e_ppo_trainer_megatron-deepseek_ascend
      VERL_COVERAGE_PLAN: '[{"id": "step-07", "name": "Prepare GSM8K dataset", "entrypoints": ["examples/data_preprocess/gsm8k.py"],
        "requires_verl_coverage": false}, {"id": "step-08", "name": "Running GSM8K E2E training tests with 3D parallelism
        on 8 NPUs with Megatron (DeepSeek)", "entrypoints": ["tests/special_e2e/run_ppo_trainer_megatron.sh"], "requires_verl_coverage":
        true}, {"id": "step-09", "name": "Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (DeepSeek)",
        "entrypoints": ["tests/special_e2e/run_ppo_trainer_megatron.sh"], "requires_verl_coverage": true}, {"id": "step-10",
        "name": "Profiling GRPO GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (Deepseek)", "entrypoints":
        ["tests/special_e2e/run_ppo_trainer_megatron.sh"], "requires_verl_coverage": true}]'
    needs:
    - validate
    name: e2e_ppo_trainer_megatron_sglang_ascend.yml / e2e_ppo_trainer_megatron-deepseek_ascend
    steps:
    - name: Check npu and CANN info
      run: |
        cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
        npu-smi info
    - name: Install uv
      run: pip install uv
    - name: Check initial pip list from image
      run: |
        uv pip list
    - name: Checkout verl-project/verl repo
