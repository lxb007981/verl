    timeout-minutes: 150
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: --shm-size 120g
    env:
      HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      TRANSFORMERS_VERBOSITY: error
      VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/vllm_ascend__1/data
      VERL_COVERAGE_WORKFLOW: vllm_ascend.yml
      VERL_COVERAGE_JOB: vllm_ascend
      VERL_COVERAGE_PLAN: '[{"id": "step-06", "name": "Prepare gsm8k dataset", "entrypoints": ["examples/data_preprocess/gsm8k.py"],
        "requires_verl_coverage": false}, {"id": "step-07", "name": "Test the latest vLLM Rollout async with deterministic
        agent loop", "entrypoints": [], "requires_verl_coverage": true}, {"id": "step-08", "name": "Test vllm server abort
        functionality", "entrypoints": ["tests/workers/rollout/rollout_vllm/test_vllm_abort.py"], "requires_verl_coverage":
        true}, {"id": "step-09", "name": "Test bucketed weight transfer", "entrypoints": ["tests/utils/test_bucketed_weight_transfer.py"],
        "requires_verl_coverage": true}]'
    needs:
    - validate
    name: vllm_ascend.yml / vllm_ascend
    steps:
    - name: Check npu and CANN info
      run: |
        cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
        npu-smi info
    - name: Check initial pip list from image
      run: |
        pip list
    - name: Checkout verl-project/verl repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
    - name: Install the current repository
      run: |
        pip3 install --no-deps -e .[test]
        pip3 install pytest-asyncio
        pip install "av<19"
        pip uninstall -y nvidia-resiliency-ext
    - name: Check final pip list
      run: |
        pip list
    - name: Prepare weights
      run: |
        ln -s /root/.cache/modelscope/hub/models ~/models
    - name: Initialize branch coverage collection
      run: |
        command -v uv >/dev/null || python -m pip install uv
        uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2"
        python scripts/ci/coverage/collect.py init
      shell: bash
    - name: Prepare gsm8k dataset
      run: |
        ray stop --force
        python3 examples/data_preprocess/gsm8k.py --local_dataset_path /root/.cache/modelscope/dataset/openai/gsm8k --local_dir ${HOME}/data/gsm8k
      shell: python scripts/ci/coverage/collect.py run step-06 {0}
    - name: Test the latest vLLM Rollout async with deterministic agent loop
      env:
        PYTHONHASHSEED: '0'
        AGENT_LOOP_TOOL_AGENT_ROLLOUT_CONFIG: |
          temperature: 0.0
          top_p: 1.0
          top_k: -1
          full_determinism: true
          seed: 0
          scheduling_policy: priority
      run: |
        export HCCL_HOST_SOCKET_PORT_RANGE=auto
        export HCCL_NPU_SOCKET_PORT_RANGE=auto
        export RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES=1
        ROLLOUT_NAME=vllm pytest -svvv tests/experimental/agent_loop
      shell: python scripts/ci/coverage/collect.py run step-07 {0}
    - name: Test vllm server abort functionality
      run: |
        pytest tests/workers/rollout/rollout_vllm/test_vllm_abort.py -v -s
      shell: python scripts/ci/coverage/collect.py run step-08 {0}
    - name: Test bucketed weight transfer
      run: |
        pytest -svvv tests/utils/test_bucketed_weight_transfer.py
      shell: python scripts/ci/coverage/collect.py run step-09 {0}
    - name: Package raw coverage (including partial runs)
      if: ${{ always() }}
      shell: bash
      run: python scripts/ci/coverage/collect.py package
    - name: Retain raw coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ascend-coverage-vllm_ascend__1-${{ github.run_attempt }}
        path: ${{ env.VERL_COVERAGE_ROOT }}/../coverage.tar.gz
        compression-level: 0
        if-no-files-found: warn
        retention-days: 14
