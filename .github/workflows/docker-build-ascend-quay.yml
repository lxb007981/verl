name: docker-build-ascend-quay

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing so concurrent runs cannot overwrite newer tags.
concurrency:
  group: docker-build-ascend-quay
  cancel-in-progress: false

env:
  QUAY_REPO: quay.io/lxb007981/verl
  # Quay robot usernames are <namespace>+<robot-name>.
  QUAY_USERNAME: lxb007981+lxb007981_robot

jobs:
  build-and-push:
    name: Build and push ${{ matrix.soc }} (ARM64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        soc: [a3, a5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PWD }}

      # These filenames are retained even though the base images use CANN 9.2.1.
      # Use the repository root as context for docker/ascend/patches COPY steps.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ascend/Dockerfile.ascend_9.1.0_${{ matrix.soc }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.QUAY_REPO }}:latest-vllm-${{ matrix.soc }}-ubuntu-arm64
            ${{ env.QUAY_REPO }}:cann9.2.1-vllm-${{ matrix.soc }}-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=quay-ascend-${{ matrix.soc }}-arm64
          cache-to: type=gha,mode=max,scope=quay-ascend-${{ matrix.soc }}-arm64
